<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"title","type":"string","label":"Title","default":"STOP SCROLLING"},
  {"id":"detail","type":"string","label":"Detail","default":"the feed is not the work"}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Outfit"; src: url("../assets/Outfit-Bold.ttf"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Instrument Serif"; src: url("../assets/InstrumentSerif-Italic.ttf"); font-style: italic; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1080px; height: 1920px; }
      #root { position: relative; width: 1080px; height: 1920px; }
      .co-sticker {
        position: absolute;
        right: 52px;
        top: 1080px;
        width: 640px;
        padding: 28px 32px 30px 28px;
        background: #f6f1e8;
        color: #141210;
        border-radius: 28px;
        box-shadow: 0 22px 50px rgba(0, 0, 0, 0.32);
        display: flex;
        gap: 22px;
        align-items: flex-start;
        transform-origin: 80% 40%;
      }
      .co-mark {
        flex: 0 0 auto;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: #e4b15a;
        color: #141210;
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .co-title {
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 42px;
        letter-spacing: 0.04em;
        line-height: 1.02;
        text-transform: uppercase;
      }
      .co-detail {
        margin-top: 8px;
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 32px;
        line-height: 1.15;
        color: #3a342c;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="callout" data-width="1080" data-height="1920" data-start="0" data-duration="6">
      <div class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="co-sticker" class="co-sticker">
          <div id="co-mark" class="co-mark">!</div>
          <div>
            <div id="co-title" class="co-title" data-var-text="title">STOP SCROLLING</div>
            <div id="co-detail" class="co-detail" data-var-text="detail">the feed is not the work</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? (window.__hyperframes.getVariables() || {}) : {};
      var title = document.getElementById("co-title");
      var detail = document.getElementById("co-detail");
      if (vars.title) title.textContent = vars.title;
      if (vars.detail) detail.textContent = vars.detail;
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#co-sticker", { y: 80, opacity: 0, rotate: -10, scale: 0.86 },
        { y: 0, opacity: 1, rotate: -3.5, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0.05);
      tl.fromTo("#co-mark", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, 0.22);
      tl.fromTo(detail, { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.32);
      window.__timelines["callout"] = tl;
    </script>
  </body>
</html>
