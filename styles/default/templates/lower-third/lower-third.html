<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"index","type":"string","label":"Index","default":"01"},
  {"id":"name","type":"string","label":"Name","default":"MATTHEW"},
  {"id":"role","type":"string","label":"Role","default":"DATING COACH"}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("../assets/Anton-Regular.ttf"); font-display: block; }
      @font-face { font-family: "Outfit"; src: url("../assets/Outfit-Bold.ttf"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Instrument Serif"; src: url("../assets/InstrumentSerif-Italic.ttf"); font-style: italic; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1080px; height: 1920px; }
      #root { position: relative; width: 1080px; height: 1920px; }
      .lt-wrap {
        position: absolute;
        left: 64px;
        bottom: 390px;
        display: flex;
        align-items: stretch;
        gap: 22px;
      }
      .lt-bar {
        width: 10px;
        background: #e4b15a;
        border-radius: 6px;
        transform-origin: 50% 100%;
      }
      .lt-index {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 42px;
        color: #e4b15a;
        line-height: 1;
        padding-top: 6px;
      }
      .lt-name {
        font-family: "Anton", sans-serif;
        font-size: 84px;
        line-height: 0.86;
        letter-spacing: 0.01em;
        color: #f6f1e8;
        text-transform: uppercase;
      }
      .lt-role {
        margin-top: 10px;
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.28em;
        color: #f6f1e8;
      }
      .lt-hair {
        margin-top: 14px;
        height: 2px;
        width: 280px;
        background: rgba(246, 241, 232, 0.7);
        transform-origin: 0% 50%;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="lower-third" data-width="1080" data-height="1920" data-start="0" data-duration="6">
      <div class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div class="lt-wrap">
          <div id="lt-bar" class="lt-bar"></div>
          <div>
            <div id="lt-index" class="lt-index" data-var-text="index">01</div>
            <div id="lt-name" class="lt-name" data-var-text="name">MATTHEW</div>
            <div id="lt-role" class="lt-role" data-var-text="role">DATING COACH</div>
            <div id="lt-hair" class="lt-hair"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? (window.__hyperframes.getVariables() || {}) : {};
      if (vars.index) document.getElementById("lt-index").textContent = vars.index;
      if (vars.name) document.getElementById("lt-name").textContent = vars.name;
      if (vars.role) document.getElementById("lt-role").textContent = vars.role;
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#lt-bar", { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out" }, 0.06);
      tl.fromTo("#lt-index", { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" }, 0.12);
      tl.fromTo("#lt-name", { y: 36, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, 0.18);
      tl.fromTo("#lt-role", { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.32);
      tl.fromTo("#lt-hair", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.inOut" }, 0.4);
      window.__timelines["lower-third"] = tl;
    </script>
  </body>
</html>
