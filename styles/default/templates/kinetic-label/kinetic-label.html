<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"kicker","type":"string","label":"Kicker","default":"THE REAL"},
  {"id":"line","type":"string","label":"Line","default":"GAP"},
  {"id":"sub","type":"string","label":"Subline","default":"between a like and a date"}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("../assets/Anton-Regular.ttf"); font-display: block; }
      @font-face { font-family: "Outfit"; src: url("../assets/Outfit-Bold.ttf"); font-weight: 700; font-display: block; }
      @font-face { font-family: "Instrument Serif"; src: url("../assets/InstrumentSerif-Italic.ttf"); font-style: italic; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1080px; height: 1920px; }
      #root { position: relative; width: 1080px; height: 1920px; }
      .kl-stack {
        position: absolute;
        left: 72px;
        top: 128px;
        width: 936px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }
      .kl-kicker {
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.42em;
        color: #e4b15a;
        padding-left: 8px;
      }
      .kl-line {
        font-family: "Anton", sans-serif;
        font-size: 228px;
        line-height: 0.84;
        letter-spacing: -0.02em;
        color: #f6f1e8;
        text-transform: uppercase;
      }
      .kl-line span { display: inline-block; white-space: pre; }
      .kl-rule {
        width: 220px;
        height: 8px;
        margin: 18px 0 10px;
        background: #e4b15a;
        transform-origin: 0% 50%;
      }
      .kl-sub {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-size: 48px;
        line-height: 1.15;
        color: #f6f1e8;
        max-width: 760px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="kinetic-label" data-width="1080" data-height="1920" data-start="0" data-duration="8">
      <div class="clip" data-start="0" data-duration="8" data-track-index="0">
        <div class="kl-stack">
          <div id="kl-kicker" class="kl-kicker" data-var-text="kicker">THE REAL</div>
          <div id="kl-line" class="kl-line" data-var-text="line">GAP</div>
          <div id="kl-rule" class="kl-rule"></div>
          <div id="kl-sub" class="kl-sub" data-var-text="sub">between a like and a date</div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? (window.__hyperframes.getVariables() || {}) : {};
      var kicker = document.getElementById("kl-kicker");
      var line = document.getElementById("kl-line");
      var sub = document.getElementById("kl-sub");
      if (vars.kicker) kicker.textContent = vars.kicker;
      if (vars.sub) sub.textContent = vars.sub;
      var letters = [];
      var text = vars.line || line.textContent || "GAP";
      line.textContent = "";
      text.split("").forEach(function (ch) {
        var s = document.createElement("span");
        s.textContent = ch === " " ? "\u00a0" : ch;
        line.appendChild(s);
        if (ch !== " ") letters.push(s);
      });

      var tl = gsap.timeline({ paused: true });
      tl.fromTo(kicker, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.05);
      letters.forEach(function (el, i) {
        tl.fromTo(el, { y: 120, opacity: 0, rotate: 8 }, { y: 0, opacity: 1, rotate: 0, duration: 0.55, ease: "power4.out" }, 0.12 + i * 0.045);
      });
      tl.fromTo("#kl-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "power3.inOut" }, 0.35);
      tl.fromTo(sub, { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.48);
      window.__timelines["kinetic-label"] = tl;
    </script>
  </body>
</html>
