<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"value","type":"string","label":"Number","default":"3"},
  {"id":"suffix","type":"string","label":"Suffix","default":"x"},
  {"id":"label","type":"string","label":"Label","default":"MORE DATES"}
]'>
  <head>
    <meta charset="UTF-8" />
    <script src="../assets/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("../assets/Anton-Regular.ttf"); font-display: block; }
      @font-face { font-family: "Outfit"; src: url("../assets/Outfit-Bold.ttf"); font-weight: 700; font-display: block; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; }
      body { width: 1080px; height: 1920px; }
      #root { position: relative; width: 1080px; height: 1920px; }
      .st-card {
        position: absolute;
        left: 56px;
        top: 1180px;
        width: 520px;
        padding: 36px 40px 32px;
        background: #f6f1e8;
        border-radius: 36px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
        display: flex;
        align-items: center;
        gap: 28px;
      }
      .st-ring { width: 148px; height: 148px; flex: 0 0 auto; }
      .st-numwrap { display: flex; flex-direction: column; min-width: 0; }
      .st-figure {
        display: flex;
        align-items: flex-start;
        gap: 4px;
        color: #141210;
      }
      .st-num {
        font-family: "Anton", sans-serif;
        font-size: 132px;
        line-height: 0.8;
        letter-spacing: -0.03em;
      }
      .st-suffix {
        font-family: "Anton", sans-serif;
        font-size: 64px;
        line-height: 1;
        color: #b8862e;
        margin-top: 6px;
      }
      .st-label {
        margin-top: 12px;
        font-family: "Outfit", sans-serif;
        font-weight: 700;
        font-size: 26px;
        letter-spacing: 0.22em;
        color: #3a342c;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stat-count" data-width="1080" data-height="1920" data-start="0" data-duration="6">
      <div class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="st-card" class="st-card">
          <svg class="st-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle cx="60" cy="60" r="50" fill="none" stroke="#141210" stroke-opacity="0.12" stroke-width="8"></circle>
            <circle id="st-ring" cx="60" cy="60" r="50" fill="none" stroke="#e4b15a" stroke-width="8"
              stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"
              transform="rotate(-90 60 60)"></circle>
          </svg>
          <div class="st-numwrap">
            <div class="st-figure">
              <div id="st-num" class="st-num">0</div>
              <div id="st-suffix" class="st-suffix" data-var-text="suffix">x</div>
            </div>
            <div id="st-label" class="st-label" data-var-text="label">MORE DATES</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      var vars = (window.__hyperframes && window.__hyperframes.getVariables) ? (window.__hyperframes.getVariables() || {}) : {};
      var target = parseFloat(vars.value || "3");
      if (!isFinite(target)) target = 3;
      var suffix = document.getElementById("st-suffix");
      var label = document.getElementById("st-label");
      var num = document.getElementById("st-num");
      if (vars.suffix) suffix.textContent = vars.suffix;
      if (vars.label) label.textContent = vars.label;
      var state = { n: 0 };
      var tl = gsap.timeline({ paused: true });
      tl.fromTo("#st-card", { y: 70, opacity: 0, scale: 0.92 }, { y: 0, opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.04);
      tl.fromTo("#st-ring", { strokeDashoffset: 314.16 }, { strokeDashoffset: 0, duration: 0.95, ease: "power2.out" }, 0.18);
      tl.fromTo(state, { n: 0 }, {
        n: target,
        duration: 0.95,
        ease: "power2.out",
        onUpdate: function () { num.textContent = String(Math.round(state.n)); }
      }, 0.18);
      tl.fromTo(label, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.4);
      window.__timelines["stat-count"] = tl;
    </script>
  </body>
</html>
